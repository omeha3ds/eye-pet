name: Build Firmware & Deploy Web Configurator

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install --upgrade pip
          pip install platformio

      - name: Build ESP32-S3 Firmware
        working-directory: ./firmware
        run: pio run

      - name: Prepare Web & Firmware Artifacts
        run: |
          mkdir -p web/firmware_bins
          cp firmware/.pio/build/waveshare_s3_amoled_175c/bootloader.bin web/firmware_bins/bootloader.bin
          cp firmware/.pio/build/waveshare_s3_amoled_175c/partitions.bin web/firmware_bins/partitions.bin
          cp firmware/.pio/build/waveshare_s3_amoled_175c/firmware.bin web/firmware_bins/firmware.bin

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy-pages:
    needs: build-firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
